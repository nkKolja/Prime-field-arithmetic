name: CI

on:
  push:
    branches: [ main, refactor_mp_arith ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [g++-12]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.compiler }}

    - name: Build and run all tests
      run: make CXX=${{ matrix.compiler }} test_all

