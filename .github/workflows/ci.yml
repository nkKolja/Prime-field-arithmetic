name: CI

on:
  push:
    branches: [ main, refactor_mp_arith ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Tests

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install g++-12
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-12

    - name: Primitives
      run: make CXX=g++-12 test_primitives

    - name: Multi-precision arithmetic
      run: make CXX=g++-12 test_mp

    - name: Montgomery / Barrett reduction
      run: make CXX=g++-12 test_montgomery

    - name: Field arithmetic (all primes)
      run: make CXX=g++-12 test_field

